# =========================================================
# CONFIGURAÇÃO CENTRAL
# =========================================================

camera:
  source: 0
  width: 640
  height: 480
  flip_horizontal: true


# =========================================================
# DETECÇÃO FACIAL
# =========================================================

face_detection:
  backend: "dlib_hog"
  haar_cascade_path: "models/haarcascade_frontalface_default.xml"
  upsample: 1
  min_confidence: 0.0


# =========================================================
# LANDMARKS FACIAIS
# =========================================================

landmarks:
  enabled: true
  predictor_path: "models/shape_predictor_68_face_landmarks.dat"
  draw_points: true
  draw_indices: false


# =========================================================
# ESTADO DOS OLHOS
# =========================================================

eye_state:
  enabled: true

  # -------------------------------------------------------
  # NORMALIZAÇÃO DO EAR
  # -------------------------------------------------------

  open_ear: 0.25
  closed_ear: 0.10

  # closed_ratio >= threshold → olho fechado
  closed_ratio_threshold: 0.60


  # -------------------------------------------------------
  # PISCADA
  # -------------------------------------------------------

  # Duração mínima para confirmar uma piscada.
  min_blink_duration_s: 0.20


  # -------------------------------------------------------
  # FECHAMENTO OCULAR PROLONGADO
  # -------------------------------------------------------

  # A partir desta duração o fechamento não é mais
  # classificado como uma piscada.
  prolonged_closure_duration_s: 3.0


# =========================================================
# BOCEJO
# =========================================================

yawn:
  enabled: true

  # Mouth Aspect Ratio
  mar_threshold: 0.60

  # Tempo mínimo com MAR acima do threshold.
  min_duration_s: 3.0


# =========================================================
# POSTURA DA CABEÇA
# =========================================================

head_pose:
  enabled: true

  draw_axis: true

  # -------------------------------------------------------
  # ROLL
  # -------------------------------------------------------

  roll_alert_threshold: 20.0
  roll_min_duration_s: 0.8

  # -------------------------------------------------------
  # PITCH
  # -------------------------------------------------------

  pitch_nodding_threshold: 12.0
  pitch_min_duration_s: 0.8

  # -------------------------------------------------------
  # YAW
  # -------------------------------------------------------

  yaw_distraction_threshold: 20.0
  yaw_min_duration_s: 0.8

  # -------------------------------------------------------
  # CALIBRAÇÃO
  # -------------------------------------------------------

  calibration_duration_s: 1.5

  auto_recalibrate: true

  stable_threshold_s: 5.0

  calibration_max_variation: 5.0


# =========================================================
# PERCLOS
# =========================================================

perclos:
  enabled: true

  # Janela de observação.
  window_s: 60.0

  # 8% do tempo observado com os olhos fechados.
  perclos_alert_threshold: 0.08

  # Piscadas por minuto.
  blink_rate_alert_threshold: 30.0

  # Bocejos por minuto.
  yawn_rate_alert_threshold: 3.0


# =========================================================
# CLASSIFICADOR (REGRESSÃO LOGÍSTICA)
# =========================================================
#
# Classifica o estado do usuário ("fadiga" / "sem_fadiga") em tempo
# real, a partir das features geradas pelos detectores acima.
#
# enabled: false até você treinar um modelo com
# `python -m src.ml.train_model` (precisa de vídeos rotulados em
# training.dataset_dir). Depois disso, mude para true.

classifier:
  enabled: false

  model_path: "models/classifier/logistic_regression.joblib"
  scaler_path: "models/classifier/scaler.joblib"

  # Se um valor não estiver disponível em face.extra num dado frame
  # (ex: detector correspondente desligado), usa este valor no lugar.
  decision_threshold: 0.5

  # Features usadas para TREINAR o modelo (a ordem importa).
  # Na hora de classificar, o próprio modelo salvo (metadados .json)
  # é quem manda — isto aqui só é usado no treino.
  features:
    - "ear"
    - "mar"
    - "perclos"
    - "blink_rate_per_min"
    - "yawn_rate_per_min"
    - "head_pose.pitch_adjusted"
    - "head_pose.yaw_adjusted"
    - "head_pose.roll_adjusted"


# =========================================================
# TREINO DO CLASSIFICADOR
# =========================================================
#
# Organize os vídeos rotulados assim (uma subpasta por classe — o
# NOME DA PASTA vira o rótulo usado pelo modelo, exatamente como está):
#
#   data/dataset/
#   ├── fadiga/
#   │   └── *.mp4
#   └── sem_fadiga/
#       └── *.mp4

training:
  dataset_dir: "data/dataset"
  output_dir: "data/output/training"

  # Processa 1 a cada N frames de cada vídeo (evita amostras
  # quase idênticas em sequência e acelera o treino).
  frame_sample_rate: 5

  test_size: 0.2
  random_state: 42
  max_iter: 1000


# =========================================================
# PICOS DE FADIGA (regressão logística + regressão linear)
# =========================================================
#
# A regressão LOGÍSTICA (classifier acima) gera, a cada frame, a
# probabilidade contínua de "fadiga". Este detector ajusta uma
# regressão LINEAR sobre essa série dentro de `window_seconds` e
# marca um PICO quando o valor atual sobe muito acima da tendência
# da janela (não apenas "está alto", mas "subiu de repente").
#
# Depende do 'classifier' acima estar habilitado.

fatigue_spike:
  enabled: false

  # Nome da classe (pasta do dataset) cuja probabilidade será
  # monitorada — deve bater com uma das pastas em training.dataset_dir.
  target_label: "fadiga"

  # A janela de tempo "x" que você quer observar, em segundos.
  window_seconds: 60.0

  # Resíduo mínimo (valor atual - tendência prevista) para contar
  # como pico. Quanto menor, mais sensível a pequenas subidas.
  spike_threshold: 0.25

  # Só conta como pico se a probabilidade absoluta também for alta —
  # evita marcar "pico" numa subida de 0.01 para 0.05, por exemplo.
  min_confidence: 0.6

  # Tempo mínimo entre dois picos contados para o mesmo rosto, evita
  # contar o mesmo pico várias vezes enquanto ele ainda está alto.
  cooldown_seconds: 5.0

  # Salva todos os picos detectados na sessão em CSV, na pasta
  # definida no config, ao final da execução (ou no finally do erro).
  log_events: true
  events_log_file: "data/output/fatigue_spikes.csv"


# =========================================================
# DISPLAY
# =========================================================

display:
  window_name: "Perception Pipeline"

  show_fps: true
  show_bbox: true
  font_scale: 0.6


# =========================================================
# LOGGING
# =========================================================

logging:
  level: "INFO"
  log_to_file: true
  log_file: "data/output/perception.log"